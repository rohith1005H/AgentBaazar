# Render Blueprint: one free web service in Ohio, next to the Neon database (us-east-2).
# Secrets are not listed here; set them on the service (Environment tab, or the Render API):
#   DATABASE_URL APP_SECRET STORE_ADMIN_TOKEN PAYPAL_CLIENT_ID PAYPAL_CLIENT_SECRET
#   PAYPAL_WEBHOOK_ID PUBLIC_URL AGENTIC_JWKS_URL JWT_ISSUER     (see .env.example)
services:
  - type: web
    name: agentbaazar
    runtime: node
    plan: free
    region: ohio
    # Render's image has its own read-only pnpm (so no `corepack enable`); run the project's
    # pnpm through npx (keep the version in sync with package.json "packageManager").
    buildCommand: npx -y pnpm@11.25.0 install --frozen-lockfile && npx -y pnpm@11.25.0 build
    startCommand: node_modules/.bin/next start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PAYPAL_ENV
        value: sandbox
      - key: WEBHOOK_VERIFY
        value: strict
      - key: LOG_LEVEL
        value: info
